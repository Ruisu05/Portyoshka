name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            make-path: |
              out/make/deb/*.deb
              out/make/rpm/*.rpm
              out/make/appimage/x64/*.AppImage
          - os: windows-latest
            name: windows
            make-path: out/make/squirrel.windows/x64/Portyoshka-*-Setup.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Set version from tag
        shell: bash
        run: npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"
      - run: npm ci
      - name: Install packaging tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm squashfs-tools
      - run: npm run make
      - name: Rename artifacts
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${{ matrix.name }}" = "linux" ]; then
            mv out/make/deb/*.deb "out/make/deb/Portyoshka-${VERSION}-Linux.deb"
            mv out/make/rpm/*.rpm "out/make/rpm/Portyoshka-${VERSION}-Linux.rpm"
            mv out/make/appimage/x64/*.AppImage "out/make/appimage/x64/Portyoshka-${VERSION}-Linux.AppImage"
          else
            mv out/make/squirrel.windows/x64/*Setup*.exe "out/make/squirrel.windows/x64/Portyoshka-${VERSION}-Windows-Setup.exe"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.name }}
          path: ${{ matrix.make-path }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -t files < <(find artifacts -type f)
          printf 'Uploading: %s\n' "${files[@]}"
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --title "$GITHUB_REF_NAME" --generate-notes
