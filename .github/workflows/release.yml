name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            make-path: |
              out/make/deb/x64/*.deb
              out/make/rpm/x64/*.rpm
              out/make/AppImage/x64/*.AppImage
          - os: windows-latest
            name: windows
            make-path: out/make/squirrel.windows/x64/Portyoshka-*-Setup.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Set version from tag
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
      - run: npm ci
      - name: Install packaging tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm squashfs-tools
      - name: Prepare Windows signing certificate
        if: runner.os == 'Windows' && secrets.WINDOWS_CERT_PFX != ''
        shell: bash
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          echo "$WINDOWS_CERT_PFX" | base64 -d > "$RUNNER_TEMP/windows-cert.pfx"
          {
            echo "WINDOWS_CERT_FILE=$RUNNER_TEMP/windows-cert.pfx"
            echo "WINDOWS_CERT_PASSWORD=$WINDOWS_CERT_PASSWORD"
          } >> "$GITHUB_ENV"
      - run: npm run make
      - name: Rename artifacts
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${{ matrix.name }}" = "linux" ]; then
            mv out/make/deb/x64/*.deb "out/make/deb/x64/Portyoshka-${VERSION}-Linux.deb"
            mv out/make/rpm/x64/*.rpm "out/make/rpm/x64/Portyoshka-${VERSION}-Linux.rpm"
            mv out/make/AppImage/x64/*.AppImage "out/make/AppImage/x64/Portyoshka-${VERSION}-Linux.AppImage"
          else
            mv out/make/squirrel.windows/x64/*Setup*.exe "out/make/squirrel.windows/x64/Portyoshka-${VERSION}-Windows-Setup.exe"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.name }}
          path: ${{ matrix.make-path }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk -v v="## ${VERSION}" '$0 == v { found=1; next } /^## / { found=0 } found { print }' CHANGELOG.md)
          if [ -z "$NOTES" ]; then NOTES="Release ${VERSION}"; fi
          mapfile -t files < <(find artifacts -type f)
          printf 'Uploading: %s\n' "${files[@]}"
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --title "$GITHUB_REF_NAME" --notes "$NOTES"
